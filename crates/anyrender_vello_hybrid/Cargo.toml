[package]
name = "anyrender_vello_hybrid"
description = "vello_gpu (formerly vello_hybrid) backend for anyrender"
version = "0.11.0"
documentation = "https://docs.rs/anyrender_vello_hybrid"
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[features]
log_frame_times = ["debug_timer/enable"]
webgl = ["vello_gpu/webgl"]
# A checked filter mode (`VelloHybridScenePainter::with_checked_filters`) that draws Gaussian chains and refuses every
# other filter instead of drawing it unfiltered. Off by default.
ahcut = ["anyrender/ahcut", "vello_common/ahcut", "vello_gpu/ahcut"]

[dependencies]
anyrender = { workspace = true }
debug_timer = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
vello_gpu = { workspace = true }
vello_common = { workspace = true }
glifo = { workspace = true }
wgpu = { workspace = true }
rustc-hash = { workspace = true }
wgpu_context = { workspace = true }
futures-channel = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }